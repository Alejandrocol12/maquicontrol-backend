spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maquicontrol}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:maquicontrol}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.max-lifetime=1500000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

# Sin valor por defecto: se define en Railway (JWT_SECRET). Si falta, el servidor genera una al arrancar y avisa en el log.
jwt.secret=${JWT_SECRET:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Brevo (API HTTP para envio de correos)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:alejorojas9.r@gmail.com}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
